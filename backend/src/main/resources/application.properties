# ===== Server =====
server.port=${PORT:8080}

# ===== Database =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/snshops_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== HikariCP Connection Pool =====
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ===== JPA / Hibernate =====
# IMPORTANT: Use 'update' so schema migrates safely. Never use 'create' in production (wipes data).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ===== JWT =====
app.jwt.secret=${JWT_SECRET:c25zaG9wcy1zZWNyZXQta2V5LXdoaWNoLWlzLXZlcnktbG9uZy1hbmQtc2VjdXJlLWZvci1oczUxMi1hbGdvcml0aG0=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===== CORS =====
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ===== Jackson =====
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# ===== Logging =====
# In production, keep INFO level. Switch to WARN to reduce noise.
logging.level.root=INFO
logging.level.com.snshops=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# ===== Actuator (Health Check for Railway/Render) =====
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

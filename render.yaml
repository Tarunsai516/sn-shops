services:
  - type: web
    name: sn-shops-backend
    env: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: DB_URL
        sync: false          # Must be jdbc:postgresql://HOST:5432/DBNAME?sslmode=require
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: ALLOWED_ORIGINS
        value: "http://localhost:5173,http://localhost:3000"
      - key: PORT
        value: "8080"
      - key: JAVA_VERSION
        value: "17"
